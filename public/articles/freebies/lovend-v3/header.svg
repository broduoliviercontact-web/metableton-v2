<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-label="LOVEND v3 — Pultec trick du low-end">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff8a1a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb347" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0%" stop-color="#ff8a1a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1376" height="768" fill="url(#bg)"/>
  <rect width="1376" height="768" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="192" x2="1376" y2="192"/>
    <line x1="0" y1="384" x2="1376" y2="384"/>
    <line x1="0" y1="576" x2="1376" y2="576"/>
    <line x1="344" y1="0" x2="344" y2="768"/>
    <line x1="688" y1="0" x2="688" y2="768"/>
    <line x1="1032" y1="0" x2="1032" y2="768"/>
  </g>

  <!-- Pultec-style boost+cut around 100 Hz curve -->
  <path d="M 60,420
           C 200,410 320,395 480,360
           C 600,335 680,300 760,360
           C 880,440 1000,470 1120,460
           C 1240,450 1300,440 1316,430"
        fill="none" stroke="url(#curve)" stroke-width="6" stroke-linecap="round"/>

  <!-- horizontal reference line -->
  <line x1="60" y1="430" x2="1316" y2="430" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 100 Hz marker -->
  <line x1="760" y1="180" x2="760" y2="588" stroke="#ff8a1a" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="760" y="200" text-anchor="middle" fill="#ffb347" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="2">100 Hz</text>

  <!-- frequency labels -->
  <g fill="#ffffff" fill-opacity="0.35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">
    <text x="60" y="640">20</text>
    <text x="320" y="640">40</text>
    <text x="560" y="640">80</text>
    <text x="900" y="640">160</text>
    <text x="1180" y="640">320</text>
  </g>

  <!-- dB scale -->
  <g fill="#ffffff" fill-opacity="0.35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">
    <text x="40" y="220">+10 dB</text>
    <text x="40" y="430">0 dB</text>
    <text x="40" y="600">-10 dB</text>
  </g>

  <!-- Title block -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="60" y="120" fill="#ff8a1a" font-size="22" letter-spacing="6" font-weight="600">METABLETON · FREEBIES</text>
    <text x="60" y="200" fill="#ffffff" font-size="84" font-weight="800" letter-spacing="-2">LOVEND v3</text>
    <text x="60" y="252" fill="#ffffff" fill-opacity="0.7" font-size="32" font-weight="500">Le Pultec trick appliqué au low-end</text>
  </g>

  <!-- bottom meta -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#ffffff" fill-opacity="0.45" letter-spacing="1">
    <text x="60" y="700">ANALOG OBSESSION</text>
    <text x="380" y="700">·</text>
    <text x="400" y="700">VST3 / AU / AAX</text>
    <text x="600" y="700">·</text>
    <text x="620" y="700">macOS / Windows</text>
    <text x="840" y="700">·</text>
    <text x="860" y="700">GRATUIT</text>
  </g>
</svg>
