<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Pultec EQP-1A — boost et atténuation simultanés à 100 Hz">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="boost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8bff"/>
      <stop offset="100%" stop-color="#2d5cff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="460" fill="url(#bgD)" rx="12"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="60" x2="80" y2="380"/>
    <line x1="80" y1="380" x2="960" y2="380"/>
    <line x1="280" y1="60" x2="280" y2="380"/>
    <line x1="480" y1="60" x2="480" y2="380"/>
    <line x1="680" y1="60" x2="680" y2="380"/>
    <line x1="880" y1="60" x2="880" y2="380"/>
    <line x1="80" y1="150" x2="960" y2="150"/>
    <line x1="80" y1="240" x2="960" y2="240"/>
  </g>

  <!-- 0 dB line -->
  <line x1="80" y1="220" x2="960" y2="220" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- boost lobe (bell around 100 Hz) -->
  <path d="M 80,220
           C 280,220 360,215 430,180
           C 480,150 520,150 560,180
           C 620,215 720,220 960,220"
        fill="none" stroke="url(#boost)" stroke-width="4" stroke-linecap="round"/>
  <text x="490" y="135" text-anchor="middle" fill="#ffb347" font-family="ui-monospace, monospace" font-size="16" font-weight="700">BOOST +4 dB</text>

  <!-- cut shelf (broader, dipping around 100 Hz) -->
  <path d="M 80,220
           C 200,225 320,250 430,290
           C 500,310 560,310 620,290
           C 720,250 840,225 960,220"
        fill="none" stroke="url(#cut)" stroke-width="4" stroke-linecap="round"/>
  <text x="490" y="345" text-anchor="middle" fill="#5b8bff" font-family="ui-monospace, monospace" font-size="16" font-weight="700">ATTÉNUATION -4 dB</text>

  <!-- 100 Hz marker -->
  <line x1="490" y1="60" x2="490" y2="380" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="490" y="50" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">100 Hz</text>

  <!-- axes labels -->
  <g fill="#ffffff" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">
    <text x="55" y="160" text-anchor="end">+10</text>
    <text x="55" y="225" text-anchor="end">0</text>
    <text x="55" y="295" text-anchor="end">-10</text>

    <text x="80" y="405" text-anchor="middle">20</text>
    <text x="280" y="405" text-anchor="middle">50</text>
    <text x="480" y="405" text-anchor="middle">100</text>
    <text x="680" y="405" text-anchor="middle">200</text>
    <text x="880" y="405" text-anchor="middle">500</text>
  </g>

  <text x="80" y="40" fill="#ff8a1a" font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="3" font-weight="600">PULTEQ EQP-1A · TRICK 100 Hz</text>
</svg>
