backend:
  name: github
  repo: broduoliviercontact-web/metableton-v2
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: editorial_workflow

collections:
  - name: articles
    label: Articles
    folder: src/content/articles
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Date, name: date, widget: datetime }
      - { label: Auteur, name: author, widget: string, default: METABLETON }
      - label: Rubrique
        name: section
        widget: select
        options:
          - { label: "Blog / News", value: "blog-news" }
          - { label: "Guides Ableton Live", value: "guides-ableton-live" }
          - { label: "Max for Live", value: "max-for-live" }
          - { label: "Midi Tools", value: "midi-tools" }
          - { label: "Freebies", value: "freebies" }
          - { label: "Ableton Extensions", value: "ableton-extensions" }
          - { label: "ABLETON TIMELINE", value: "ableton-timeline" }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Image, name: cover, widget: image, required: false }
      - { label: Texte alternatif, name: coverAlt, widget: string, required: false }
      - { label: Article vedette, name: featured, widget: boolean, default: false }
      - { label: Brouillon, name: draft, widget: boolean, default: false }
      - { label: Corps, name: body, widget: markdown }
